# garfield configuration.
#
# This file is optional: without it, the defaults compiled into the
# executable apply. Each key takes the form <section>.<flag-name>.
#
# A flag passed on the command line always wins over this file.

# Quality criteria for an image, applied by analyze AND by prepare.
# Every change is a decision: this is what determines which images
# are discarded.
thresholds:
  min-snr: 11.0
  max-fwhm: 5.0
  max-ecc: 0.54
  min-score: 2.0
  min-stars: 680

# Parallelism, read by analyze AND by prepare.
# 0 = automatic (NumCPU/2 for workers, core count for conv-workers).
concurrency:
  workers: 0
  conv-workers: 0

# Default directories for prepare, and how many flats each session collects.
prepare:
  input: /Volumes/Dyno/Kosmodrom
  output: /Volumes/T7/Workspace

  # Which camera wrote the filenames.
  #
  # c3 = Moravian C3: filenames carry a position angle and a gain setting.
  # g4 = Moravian G4 (CCD): no rotator and no gain, so position angle is
  #      neither read nor matched, and master bias/dark are keyed on the
  #      sensor temperature setpoint instead of a gain.
  #
  # An unknown value is rejected rather than defaulted, so a typo cannot
  # silently apply the other camera's matching rules.
  camera: c3

  # Flats wanted per filter and angle, 0 = the session's own date only.
  # A session rarely holds this many of its own, so a positive value tops it
  # up from the target's neighbouring nights, previous date first. Set to 0 to
  # keep a session strictly to the flats it shot that night.
  flat-count: 0

# Default directory for analyze.
#
# recursive: false analyses only the images placed directly in dir.
# true also walks the subdirectories. A -r on the command line wins
# over this value.
analyze:
  dir: images
  recursive: false