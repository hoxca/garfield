# garfield configuration.
#
# This file is optional: without it, the defaults compiled into the
# executable apply. Each key takes the form <section>.<flag-name>.
#
# A flag passed on the command line always wins over this file.

# Quality criteria for an image, applied by analyze AND by prepare.
# Every change is a decision: this is what determines which images
# are discarded.
thresholds:
  min-snr: 11.0
  max-fwhm: 3.2
  max-ecc: 0.64
  min-score: 2.0
  min-stars: 380

  # PSF profile used to measure width and shape.
  #
  # false = Gaussian. Cheapest, and the default.
  # true  = Moffat. Slower (~5x the per-star fit cost) but the FWHM of a real
  #         PSF agrees with PixInsight, where a Gaussian reads ~0.3 px wide on
  #         undersampled data.
  #
  # Applies to analyze AND prepare. Metrics from the two modes are not
  # comparable: scores rise when FWHM reads smaller.
  moffat: false

  # Outlier rejection: FWHM, cloud and bad seeing.
  #
  # REJECTED FWHM when a frame's FWHM lies more than max-fwhm-sigma robust
  # sigmas above the median of every frame of that filter in the run.
  # REJECTED CLOUDS when haloRatio exceeds max-halo-ratio; REJECTED BAD SEEING
  # when structureRatio exceeds max-structure. The halo and structure rules
  # compare a frame with the rest of its session and filter, so a night that is
  # uniformly brighter or more structured does not reject itself.
  #
  # haloRatio is the wing brightness of the brightest stars relative to its
  # session's 25th percentile. Thin cloud scatters starlight into a wide
  # aureole: the wings grow several-fold while the core and the PSF width
  # barely move. It is a shape measurement, not a sky level, so moonlight,
  # twilight and low altitude cannot produce it.
  #
  # structureRatio is the sky's block-to-block variation relative to its
  # session's 25th percentile, used as a bad-seeing signal.
  #
  # FWHM uses median + max-fwhm-sigma * 1.4826 * MAD over the filter's whole
  # population, upper tail only; a frame sharper than the median is never
  # rejected. The gate needs at least 8 frames of that filter, and is skipped
  # when the MAD is zero. Because the population is the run, analyzing one
  # night and analyzing the whole target can produce different bounds.
  #
  # 0 disables a rule. max-halo-ratio was calibrated on one target's clouded
  # frames: 2.0 rejected all three obvious clouds and nothing else in 71
  # frames. Expect to retune it on your own data.
  max-fwhm-sigma: 3.0
  max-halo-ratio: 2.0
  max-structure: 1.12

# Parallelism, read by analyze AND by prepare.
# 0 = automatic (NumCPU/2 for workers, core count for conv-workers).
concurrency:
  workers: 0
  conv-workers: 0

# Default directories for prepare, and how many flats each session collects.
prepare:
  input: /Volumes/Kosmodrom_2022/Kosmodrom
  output: /Volumes/T7/Workspace

  # Which camera wrote the filenames.
  #
  # c3 = Moravian C3: filenames carry a position angle and a gain setting.
  # g4 = Moravian G4 (CCD): no rotator and no gain, so position angle is
  #      neither read nor matched, and master bias/dark are keyed on the
  #      sensor temperature setpoint instead of a gain.
  #
  # An unknown value is rejected rather than defaulted, so a typo cannot
  # silently apply the other camera's matching rules.
  camera: c3

  # Flats wanted per filter and angle, 0 = the session's own date only.
  # A session rarely holds this many of its own, so a positive value tops it
  # up from the target's neighbouring nights, previous date first. Set to 0 to
  # keep a session strictly to the flats it shot that night.
  flat-count: 0

# Default directory for analyze.
#
# recursive: false analyses only the images placed directly in dir.
# true also walks the subdirectories. A -r on the command line wins
# over this value.
analyze:
  dir: images
  recursive: false
